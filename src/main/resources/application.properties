spring.application.name=wowr-register
server.port=8080

# Base de datos (reino único)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/characters?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SOAP emulador (un solo reino)
app.soap.emulator.uri=${APP_SOAP_URI:http://127.0.0.1:7878}
app.soap.emulator.username=${APP_SOAP_USERNAME:}
app.soap.emulator.password=${APP_SOAP_PASSWORD:}

# CORS para la web React
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
