spring.application.name=wowr-register
server.port=8080

# --- 3 bases de datos del emulador WoW (auth, characters, world) ---

# 1) auth: account, realmlist, account_banned, account_muted
spring.datasource.auth.url=${SPRING_DATASOURCE_AUTH_URL:jdbc:mysql://localhost:3306/auth?useUnicode=true&characterEncoding=utf8}
spring.datasource.auth.username=${SPRING_DATASOURCE_AUTH_USERNAME:root}
spring.datasource.auth.password=${SPRING_DATASOURCE_AUTH_PASSWORD:Wowlibre96@@}
spring.datasource.auth.driver-class-name=com.mysql.cj.jdbc.Driver

# 2) characters: characters, guild, guild_member, character_inventory, mail, etc.
spring.datasource.characters.url=${SPRING_DATASOURCE_CHARACTERS_URL:jdbc:mysql://localhost:3306/characters?useUnicode=true&characterEncoding=utf8}
spring.datasource.characters.username=${SPRING_DATASOURCE_CHARACTERS_USERNAME:root}
spring.datasource.characters.password=${SPRING_DATASOURCE_CHARACTERS_PASSWORD:Wowlibre96@@}
spring.datasource.characters.driver-class-name=com.mysql.cj.jdbc.Driver

# 3) world: item_template, creature_template, quest templates, etc.
spring.datasource.world.url=${SPRING_DATASOURCE_WORLD_URL:jdbc:mysql://localhost:3306/world?useUnicode=true&characterEncoding=utf8}
spring.datasource.world.username=${SPRING_DATASOURCE_WORLD_USERNAME:root}
spring.datasource.world.password=${SPRING_DATASOURCE_WORLD_PASSWORD:Wowlibre96@@}
spring.datasource.world.driver-class-name=com.mysql.cj.jdbc.Driver

# Si arranca con "Failed to configure a DataSource", descomenta:
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# JPA (cada config usa su propio datasource)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SOAP emulador (un solo reino)
app.soap.emulator.uri=${APP_SOAP_URI:http://127.0.0.1:7878}
app.soap.emulator.username=${APP_SOAP_USERNAME:}
app.soap.emulator.password=${APP_SOAP_PASSWORD:}

# CORS para la web React
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
